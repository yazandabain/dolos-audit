[project]
name = "dolos-audit-cpu-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub==1.33.0",
  "safetensors==0.8.0",
  "torch==2.11.0",
  "transformers==5.7.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
