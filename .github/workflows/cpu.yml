name: CPU checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: [self-hosted, Linux, X64, dolos-audit-cpu]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check dolos_audit tests scripts
      - run: uv run --locked ruff format --check dolos_audit tests scripts
      - run: uv run --locked python -m pytest -q
      - run: uv lock --check
