[project]
name = "dolos-audit"
version = "0.1.0"
description = "Evidence-preserving audit of the Dolos model organism"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".local", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
